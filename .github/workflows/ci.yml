name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: skywalk_db_test
          POSTGRES_USER: skywalk_user
          POSTGRES_PASSWORD: skywalk_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U skywalk_user -d skywalk_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: skywalk_user
      DB_PASS: skywalk_password
      DB_NAME: skywalk_db_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm run test -- --passWithNoTests --forceExit

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    # Non-bloquant pour le déploiement pour l'instant (voir needs de
    # deploy-backend/deploy-frontend, inchangés) : le temps de vérifier que
    # cette suite plus jeune est stable en CI avant de la rendre bloquante.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: skywalk_db_test
          POSTGRES_USER: skywalk_user
          POSTGRES_PASSWORD: skywalk_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U skywalk_user -d skywalk_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: skywalk_user
      DB_PASS: skywalk_password
      DB_NAME: skywalk_db_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Migre le schéma puis lance les 27 suites e2e (test/*.e2e-spec.ts) —
      # global-setup.js s'occupe des migrations, --forceExit ferme les
      # connexions/cron qui empêcheraient sinon Jest de rendre la main.
      - name: Run E2E tests
        working-directory: backend
        run: npm run test:e2e

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: skywalk-frontend/package-lock.json

      - name: Install dependencies
        working-directory: skywalk-frontend
        run: npm ci

      - name: Lint
        working-directory: skywalk-frontend
        run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: skywalk-frontend/package-lock.json

      - name: Install dependencies
        working-directory: skywalk-frontend
        run: npm ci

      - name: Run tests
        working-directory: skywalk-frontend
        run: npm run test

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    # Playwright démarre lui-même le backend (`npm run start:dev`) ET le
    # frontend (`npm run dev`) réels — voir skywalk-frontend/playwright.config.ts.
    # Non-bloquant pour le déploiement pour l'instant, même logique que
    # backend-e2e ci-dessus.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: skywalk_db_test
          POSTGRES_USER: skywalk_user
          POSTGRES_PASSWORD: skywalk_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U skywalk_user -d skywalk_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: skywalk_user
      DB_PASS: skywalk_password
      DB_NAME: skywalk_db_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            skywalk-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # `start:dev` (nest start --watch) ne migre rien tout seul, contrairement
      # au global-setup de la suite jest e2e du backend — sans ça, la base est
      # vide et le premier test échoue sur des tables inexistantes.
      - name: Run backend migrations
        working-directory: backend
        run: npm run migration:run

      - name: Install frontend dependencies
        working-directory: skywalk-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: skywalk-frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: skywalk-frontend
        run: npm run test:e2e

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 1

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: skywalk-frontend/package-lock.json

      - name: Install dependencies
        working-directory: skywalk-frontend
        run: npm ci

      - name: Build
        working-directory: skywalk-frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: skywalk-frontend/dist/
          retention-days: 1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build --no-cache

  deploy-backend:
    name: Deploy Backend (Heroku)
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      # Les runners ubuntu-latest n'embarquent plus la CLI Heroku, et
      # akhileshns/heroku-deploy ne l'installe pas : sans elle, son check
      # apps:info échoue en silence (« heroku: not found ») puis il retombe
      # sur un `heroku create` qui échoue aussi.
      # Version épinglée depuis npm (paquet officiel Heroku) plutôt que
      # `curl … | sh` : pas d'exécution de script distant non versionné en CI.
      - name: Install Heroku CLI
        run: npm install --global heroku@11.1.1

      # Heroku's own git integration doesn't apply here since the app is
      # only a subdirectory of this monorepo (see heroku-buildpack-monorepo
      # + APP_BASE=backend in DEPLOIEMENT.md) — this pushes the whole repo
      # to Heroku's git remote and lets that buildpack extract backend/.
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          branch: develop

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # Pas de working-directory : le projet Vercel a « Root Directory =
    # skywalk-frontend » dans ses réglages ; se placer soi-même dans le dossier
    # faisait chercher skywalk-frontend/skywalk-frontend au deploy.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
