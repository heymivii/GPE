services:
  db:
    image: postgres:15-alpine
    container_name: skywalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skywalk_db
      POSTGRES_USER: ${DB_USERNAME:-skywalk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skywalk_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skywalk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-skywalk_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skywalk-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USERNAME:-skywalk_user}
      DB_PASS: ${DB_PASSWORD:-skywalk_password}
      DB_NAME: skywalk_db
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY}
      MAIL_HOST: ${MAIL_HOST:-smtp.ethereal.email}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@skywalk.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skywalk-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./skywalk-frontend
      dockerfile: Dockerfile
    container_name: skywalk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skywalk-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  skywalk-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
