services:
  db:
    image: postgres:15
    restart: always
    container_name: skywalk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skywalk_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      

  backend:
    build:
      context: ./backend
    container_name: nest-backend
    depends_on:
      - db
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: npm run start:dev

volumes:
  pgdata:
