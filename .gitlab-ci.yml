stages:
  - test
  - build
  - docker

variables:
  NODE_VERSION: "20"
  POSTGRES_DB: skywalk_db_test
  POSTGRES_USER: skywalk_user
  POSTGRES_PASSWORD: skywalk_password

.node-cache: &node-cache
  cache:
    key:
      files:
        - backend/package-lock.json
        - skywalk-frontend/package-lock.json
    paths:
      - backend/node_modules/
      - skywalk-frontend/node_modules/

backend:lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npm run lint
  allow_failure: true

backend:test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - name: postgres:15-alpine
      alias: db
      variables:
        POSTGRES_DB: $POSTGRES_DB
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
  <<: *node-cache
  variables:
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: $POSTGRES_USER
    DB_PASS: $POSTGRES_PASSWORD
    DB_NAME: $POSTGRES_DB
    JWT_SECRET: ci-test-secret
    JWT_REFRESH_SECRET: ci-test-refresh-secret
    NODE_ENV: test
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npm run test -- --passWithNoTests --forceExit
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

frontend:lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  before_script:
    - cd skywalk-frontend
    - npm ci --prefer-offline
  script:
    - npm run lint
  allow_failure: true

frontend:test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  before_script:
    - cd skywalk-frontend
    - npm ci --prefer-offline
  script:
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

backend:build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - backend/dist/
    expire_in: 1 hour
  needs:
    - backend:test

frontend:build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  before_script:
    - cd skywalk-frontend
    - npm ci --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - skywalk-frontend/dist/
    expire_in: 1 hour
  needs:
    - frontend:test

docker:build:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker compose build --no-cache
  needs:
    - backend:build
    - frontend:build
  allow_failure: true
  only:
    - main
    - develop
